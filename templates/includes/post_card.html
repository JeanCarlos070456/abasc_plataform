<article class="news-card">
    <a class="news-card-image" href="{{ post.get_absolute_url }}">
        <img src="{{ post.cover_url }}" alt="" loading="lazy">
        {% if post.is_opportunity %}
            <span class="image-badge">Oportunidade</span>
        {% endif %}
    </a>
    <div class="news-card-body">
        <div class="card-meta">
            <span>{{ post.category.name }}</span>
            <time>{{ post.published_at|date:'d/m/Y' }}</time>
        </div>
        <h3>
            <a href="{{ post.get_absolute_url }}">{{ post.title }}</a>
        </h3>
        <p>{{ post.summary|truncatechars:145 }}</p>
        <a class="text-link" href="{{ post.get_absolute_url }}">
            Ler publicação →
        </a>
    </div>
</article>
