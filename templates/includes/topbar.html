<div class="topbar">
    <div class="container topbar-inner">
        <a href="mailto:{{ site_config.contact_email|default:abasc_contact_email }}">
            ✉ {{ site_config.contact_email|default:abasc_contact_email }}
        </a>
        <div class="topbar-actions">
            <a href="{% url 'core:contact' %}">Contato</a>
            {% if user.is_authenticated %}
                <span>Olá, {{ user.display_name }}</span>
            {% else %}
                <a href="{% url 'accounts:login' %}">Área do associado</a>
            {% endif %}
        </div>
    </div>
</div>
