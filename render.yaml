services:
  - type: web
    name: abasc-mvp1
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn abasc_mvp1.wsgi:application --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: ENABLE_LOCAL_AUTH
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET_NEWS
        value: abasc-news
      - key: SUPABASE_STORAGE_BUCKET_AVATARS
        value: abasc-avatars
